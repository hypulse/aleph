# Same rules as the shell: A plays/pauses, B leaves, arrows seek and change volume.
GAMEPAD_ACTION_RIGHT cycle pause
GAMEPAD_START cycle pause
GAMEPAD_ACTION_DOWN quit-watch-later
GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_DPAD_UP add volume 5
GAMEPAD_DPAD_DOWN add volume -5
GAMEPAD_LEFT_SHOULDER seek -60
GAMEPAD_RIGHT_SHOULDER seek 60
GAMEPAD_ACTION_UP show-progress
GAMEPAD_ACTION_LEFT cycle sub
GAMEPAD_BACK cycle audio
