# aleph: the shell owns workspace 1; every app it launches gets a workspace of its own.
default_border none
default_floating_border none
focus_follows_mouse no
mouse_warping none
seat * hide_cursor 1

for_window [app_id="^aleph-shell$"] fullscreen enable
assign [app_id="^aleph-app-2$"] workspace number 2
assign [app_id="^aleph-app-3$"] workspace number 3
assign [app_id="^aleph-app-4$"] workspace number 4
assign [app_id="^aleph-app-5$"] workspace number 5
assign [app_id="^aleph-app-6$"] workspace number 6
for_window [app_id="^aleph-app-"] fullscreen enable
for_window [app_id="^retroarch$"] fullscreen enable
